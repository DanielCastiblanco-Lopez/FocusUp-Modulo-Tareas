# =====================================================
# FocusUp - Módulo de Tareas
# Configuración de Spring Boot
# Evidencia: GA7-220501096-AA3-EV01
# =====================================================

# ── Servidor ──────────────────────────────────────────
server.port=8080
server.servlet.context-path=/focusup

# ── Base de datos MySQL ───────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/focusup_tareas_db?useSSL=false&serverTimezone=America/Bogota&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=FocusUp!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────
# update: crea/actualiza tablas automáticamente según las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Thymeleaf ─────────────────────────────────────────
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ── Mensajes de log ───────────────────────────────────
logging.level.com.focusup=DEBUG
logging.level.org.springframework.web=INFO

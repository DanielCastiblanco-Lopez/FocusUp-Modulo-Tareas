

# ── Servidor ──────────────────────────────────────────
server.port=8080
server.servlet.context-path=/focusup

# ── Sesión (login) ────────────────────────────────────
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# ── Base de datos MySQL ───────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/focusup_db?useSSL=false&serverTimezone=America/Bogota&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=FocusUp!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Administrador inicial ─────────────────────────────
# Se crea al arrancar solo si todavía no existe ningún administrador.
focusup.admin.email=admin@focusup.com
focusup.admin.password=Admin123*

# ── Thymeleaf ─────────────────────────────────────────
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ── Mensajes de log ───────────────────────────────────
logging.level.com.focusup=INFO
logging.level.org.springframework.web=INFO

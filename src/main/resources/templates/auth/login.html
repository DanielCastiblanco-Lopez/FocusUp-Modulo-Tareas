<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>FocusUp — Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body>

<header class="topbar">
    <a th:href="@{/login}" class="brand">FocusUp</a>
    <nav><a th:href="@{/registro}">Crear cuenta</a></nav>
</header>

<div class="container" style="max-width:440px;">
    <div class="card">
        <div class="card-header"><h2>Iniciar sesión</h2></div>

        <div th:if="${salio}" class="alert alert-success">Cerraste sesión correctamente.</div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" name="_csrf" th:value="${csrf}"/>

            <div class="form-group">
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" th:value="${email}" required autofocus/>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required/>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Entrar</button>
        </form>

        <p class="aviso">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
    </div>
</div>

<footer>FocusUp © 2026 | Daniel Castiblanco</footer>
</body>
</html>
